# Launchpads + DEX venues. Runtime reads this file only (launchpads.discovered.yaml is the curated evidence it is built from).
#
# Per-network: `networks.<testnet|mainnet>` overrides factory/router/kind/factories/routers/aux.
# factories[].kind:  univ2|univ3 = AMM factory (pool provenance root for the @everyone gate)
#                    lift|tolly|warp|radar = mainnet launcher adapter (src/decode/adapters.ts)
#                    generic = placeholder ABI · todo = code verified, no decoder (probed only, never trusted)
# factories[].role:  launch (default for launchers) | amm (default for univ2/univ3) | migration
# Every mainnet CA below is listed in launchpads.discovered.yaml (getCode > 0 on chain 5042, 2026-09-14) and was
# re-verified 2026-09-14 via rpc.arc-scan.org: bytecode topics + real logs over the last 600k blocks (~84h).
# Pad tokens = protocol/launchpad coins to size IF pad wins flow (see pad-tokens.yaml).

